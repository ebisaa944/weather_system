services:
  - type: web
    name: weather-system
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: bash start.sh
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: weather_system.settings
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: weather-system-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weather-system-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: weather-system-redis
          property: connectionString
      - key: WEATHER_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

  - type: redis
    name: weather-system-redis
    plan: starter
    ipAllowList: []

databases:
  - name: weather-system-db
    plan: basic-256mb
